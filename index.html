<title>範疇二 多元人才培訓</title>
<!-- site-lock -->
<style>
:root{--bg:#F4F5F6;--surface:#fff;--ink:#2B3035;--muted:#5C6367;--line:#DFE2E5;--brand:#1F6FA8;--err:#C2402B}
@media (prefers-color-scheme:dark){:root{--bg:#1E2226;--surface:#292E33;--ink:#EEF0F2;--muted:#A7ABAE;--line:#3A4046;--brand:#8DB4D6;--err:#F7877A}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);
  font-family:Arial,"Microsoft JhengHei","微軟正黑體","PingFang TC",sans-serif}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 26px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.logo{display:block;max-width:220px;height:auto;margin:0 auto 18px;background:#fff;border-radius:8px;padding:6px 10px}
h1{font-size:20px;text-align:center;margin:0 0 22px}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
button{width:100%;margin-top:22px;font:inherit;font-size:16px;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:14px;margin:12px 0 0;min-height:1.2em;text-align:center}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">

  <p class="err" id="e" role="alert"></p>
</form>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d(P.i)},key,d(P.c)));
  // 登入頁載入完成後才換成內容頁；載入中呼叫 document.open 會變成附加而不是取代
  if(document.readyState!=="complete") await new Promise(r=>addEventListener("load",r,{once:true}));
  document.open();document.write(html);document.close();
}
async function derive(u,p){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(u.trim().toLowerCase()+"\n"+p),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:d(P.s),iterations:P.n},base,256));
}
// 同一個瀏覽器分頁登入過，就直接開（關閉分頁後需重新登入）
try{const k=sessionStorage.getItem(K);if(k){open(d(k)).catch(()=>{try{sessionStorage.removeItem(K)}catch(e){}});}}catch(e){}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const b=document.getElementById("b"),e=document.getElementById("e");
  b.disabled=true;e.textContent="";
  try{
    const raw=await derive(document.getElementById("u").value,document.getElementById("p").value);
    await open(raw);
    try{sessionStorage.setItem(K,btoa(String.fromCharCode(...raw)))}catch(x){}
  }catch(x){e.textContent="帳號或密碼不正確";b.disabled=false;document.getElementById("p").select();}
});
})();
